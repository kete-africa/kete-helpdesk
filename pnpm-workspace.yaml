# pnpm settings of this repository. Build scripts run only when approved here.
allowBuilds:
  esbuild: true
  # Optional native builds of the Testcontainers stack (ssh2): the JavaScript fallbacks suffice.
  cpu-features: false
  protobufjs: false
  ssh2: false

# Kete's own packages are trusted as soon as kete-core publishes them; everything else waits for
# pnpm's minimum release age.
minimumReleaseAgeExclude:
  - '@kete-africa/*'

# Fixed versions of advisories published in October 2026, until each dependent asks for them:
# vitest's tinypool (GHSA-85c8-ppgw-ccpr and its sibling), vite 7 (GHSA-587h-7wmj-h5pm).
overrides:
  vitest>tinypool: ^2.1.2
  'vite@>=7.0.0 <7.3.7': ^7.3.7
